name: automatic release threshold

on:
  push:
    branches: [master]
  # Also retry an interrupted or failed release without another commit.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: automatic-release-master
  cancel-in-progress: false

jobs:
  check-and-release:
    name: Release after 500 changed code lines
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_THRESHOLD: "500"

    steps:
      # A queued run must plan from current master, not an obsolete push.
      - name: Checkout current master with complete history
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Test release planning and recovery
        run: python3 -m unittest discover -s scripts -p 'test_auto_release.py' -v

      - name: Calculate changes since the latest successful release
        id: plan
        run: |
          git fetch --tags origin
          python3 scripts/auto-release.py plan --plan "$RUNNER_TEMP/auto-release.json"

      - name: Set up Node.js
        if: steps.plan.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Frontend failures must not consume a version number or reset the counter.
      - name: Verify frontend before creating a version tag
        if: steps.plan.outputs.should_release == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Publish and verify binary and container releases
        if: steps.plan.outputs.should_release == 'true'
        run: python3 scripts/auto-release.py publish --plan "$RUNNER_TEMP/auto-release.json"
